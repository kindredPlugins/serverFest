name: serverFest
version: '${version}'
author: gaderman244

main: at.gaderman.serverFest.ServerFest
api-version: '26.2'
load: POSTWORLD
folia-supported: false

description: Introduces fests to the server which are server-side events of minigames which do not influence the main world

softdepend:
  - PlaceholderAPI

commands:
  fest:
    description: Manage or start a new fest

permissions:
  serverFest.fest.manage:
    description: Manage or start a new fest
    default: op