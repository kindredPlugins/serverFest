name: serverFest
version: '${version}'
author: gaderman244

main: at.gaderman.serverFest.ServerFest
api-version: '1.21'
load: POSTWORLD
folia-supported: false

description:
  Paper Plugin that adds vanilla-styled minigames to the server in form of fests.
  Schedule fests or duel other players in elytra races, pvp tournaments and many more.

softdepend:
  - PlaceholderAPI

commands:
  fest:
    description: General command revolving around everything of fests, both admin and general

permissions:
  serverFest.fest.manage:
    description: Manage or start a new fest
    default: op